name: Sync to Hugging Face Space

on:
  push:
    branches: ['case_study_1_2025']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Install Git LFS
        run: git lfs install

      - name: Check HF_TOKEN
        id: guard
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is missing. Add it in Settings -> Secrets and variables -> Actions."
            echo "continue=false" >> $GITHUB_OUTPUT
          else
            echo "continue=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git author
        if: steps.guard.outputs.continue == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Remove extra header for huggingface.co
        if: steps.guard.outputs.continue == 'true'
        run: git config --global --unset-all http.https://huggingface.co/.extraheader || true

      - name: Push to Space main
        if: steps.guard.outputs.continue == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          HF_SPACE="jujubean519/CSDS553_Demo"

          # Reset or add the 'hf' remote with token auth
          git remote remove hf 2>/dev/null || true
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}.git"

          # 1) Fetch remote main so the lease has a known expected OID
          git fetch hf main --prune

          # 2) Get the current remote OID for refs/heads/main
          REMOTE_OID="$(git rev-parse --verify -q hf/main || echo '')"

          # 3) Push with a lease if we know the remote OID; otherwise fall back to --force
          if [ -n "$REMOTE_OID" ]; then
            git push hf HEAD:main --force-with-lease=refs/heads/main:"$REMOTE_OID"
          else
            # Remote main doesn't exist (or couldn't be read) -> explicit overwrite
            git push hf HEAD:main --force
          fi
