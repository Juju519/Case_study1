# .github/workflows/sync-to-github.yml
name: Sync to GitHub

on:
  push:
    branches: [case_study_1_2025]
  workflow_dispatch:

permissions:
  contents: write   # <-- critical

jobs:
  sync-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no persisted creds)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Git LFS
        run: git lfs install

      - name: Configure git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push to branch with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Repoint origin to include token
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Push current HEAD to case_study_1_2025
          git push origin HEAD:case_study_1_2025 --force-with-lease
