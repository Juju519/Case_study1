name: Run chatbot test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you have a requirements.txt, prefer it:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest gradio[oauth] huggingface_hub transformers torch

      - name: Run pytest (HF token optional)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}            # optional if your tests hit HF
          LOCAL_MODEL: sshleifer/tiny-gpt2             # keeps tests fast in CI
        run: pytest -q
